    <text class="wf-text" style="--i:18" x="556" y="356" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" letter-spacing="2.5" fill="#e9a28e">STRATEGY</text>
    <line class="wf-draw" style="--i:18" x1="176" y1="374" x2="232" y2="374" stroke="#e9a28e" stroke-width="1.1" pathLength="1"/>
    <line class="wf-draw" style="--i:18" x1="184" y1="383" x2="224" y2="383" stroke="#e9a28e" stroke-width="1.1" pathLength="1"/>
    <line class="wf-draw" style="--i:19" x1="352" y1="374" x2="408" y2="374" stroke="#e9a28e" stroke-width="1.1" pathLength="1"/>
