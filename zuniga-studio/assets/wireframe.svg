    <text class="wf-text" style="--i:22" x="380" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" letter-spacing="3.5" fill="#e9a28e">CASE STUDIES</text>

    <rect class="wf-draw" style="--i:23" x="148" y="462" width="144" height="56" rx="2" stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
    <line class="wf-draw" style="--i:24" x1="148" y1="462" x2="292" y2="518" stroke="#e9a28e" stroke-width="1" pathLength="1"/>
    <line class="wf-draw" style="--i:24" x1="292" y1="462" x2="148" y2="518" stroke="#e9a28e" stroke-width="1" pathLength="1"/>
    <rect class="wf-draw" style="--i:25" x="308" y="462" width="144" height="56" rx="2" stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
    <line class="wf-draw" style="--i:26" x1="308" y1="462" x2="452" y2="518" stroke="#e9a28e" stroke-width="1" pathLength="1"/>
    <line class="wf-draw" style="--i:26" x1="452" y1="462" x2="308" y2="518" stroke="#e9a28e" stroke-width="1" pathLength="1"/>
    <rect class="wf-draw" style="--i:27" x="468" y="462" width="144" height="56" rx="2" stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
    <line class="wf-draw" style="--i:28" x1="468" y1="462" x2="612" y2="518" stroke="#e9a28e" stroke-width="1" pathLength="1"/>
    <line class="wf-draw" style="--i:28" x1="612" y1="462" x2="468" y2="518" stroke="#e9a28e" stroke-width="1" pathLength="1"/>

    <polyline class="wf-draw" style="--i:29" points="136,482 128,490 136,498" stroke="#e9a28e" stroke-width="1.5" pathLength="1"/>
    <polyline class="wf-draw" style="--i:29" points="624,482 632,490 624,498" stroke="#e9a28e" stroke-width="1.5" pathLength="1"/>

    <!-- carousel dots (middle one gold — the single luxury punctuation) -->
    <circle class="wf-draw" style="--i:30" cx="364" cy="528" r="3"   stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
    <circle class="wf-draw wf-gold" style="--i:30" cx="380" cy="528" r="3.2" stroke="#d69e48" stroke-width="1.2" pathLength="1"/>
    <circle class="wf-draw" style="--i:30" cx="396" cy="528" r="3"   stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
