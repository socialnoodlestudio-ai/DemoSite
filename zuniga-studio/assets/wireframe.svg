    <line class="wf-draw wf-faint" style="--i:4" x1="712" y1="308" x2="712" y2="328" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:4" x1="34"  y1="476" x2="54"  y2="476" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:4" x1="44"  y1="466" x2="44"  y2="486" stroke="#b8756a" stroke-width="1" pathLength="1"/>
  </g>

  <!-- ====== glowing panel ====== -->
  <g class="wf-glow">

