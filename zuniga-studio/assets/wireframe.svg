<svg class="wf" viewBox="0 0 760 600" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blueprint wireframe of the demo homepage drawing itself">

  <!-- ====== construction scaffold (faint, extends past panel edges) ====== -->
