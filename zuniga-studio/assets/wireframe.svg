    <rect class="wf-draw" style="--i:16" x="300" y="316" width="160" height="96" rx="3" stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
    <rect class="wf-draw" style="--i:17" x="476" y="316" width="160" height="96" rx="3" stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
