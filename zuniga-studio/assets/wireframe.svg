    <line class="wf-draw wf-faint" style="--i:1" x1="0"   y1="100" x2="760" y2="100" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:1" x1="124" y1="0"   x2="124" y2="600" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:2" x1="636" y1="8"   x2="636" y2="600" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:2" x1="24"  y1="264" x2="760" y2="264" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:3" x1="0"   y1="560" x2="744" y2="560" stroke="#b8756a" stroke-width="1" pathLength="1"/>
    <line class="wf-draw wf-faint" style="--i:3" x1="380" y1="566" x2="380" y2="600" stroke="#b8756a" stroke-width="1" pathLength="1"/>
