    <text class="wf-text wf-text-bright" style="--i:6" x="88" y="77" font-family="Inter, system-ui, sans-serif" font-size="16" letter-spacing="3" fill="#f7c7b0">ZUNIGA STUDIO.</text>
    <rect class="wf-draw" style="--i:7" x="648" y="54" width="36" height="36" rx="3" stroke="#e9a28e" stroke-width="1.2" pathLength="1"/>
    <text class="wf-text wf-text-serif" style="--i:7" x="666" y="77" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" letter-spacing="1" fill="#f7c7b0">ZS</text>

    <!-- inner content frame -->
    <rect class="wf-draw" style="--i:8" x="100" y="120" width="560" height="418" rx="4" stroke="#e9a28e" stroke-width="1" pathLength="1"/>

